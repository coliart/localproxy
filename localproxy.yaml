port: 7890
socks-port: 7891
allow-lan: false
mode: rule

proxy-groups:
  - name: "UDP-Blocker"
  # 关键点：创建一个专用的拦截组，里面不放任何节点，直接用 REJECT
    type: select
    proxies:
      - REJECT

  - name: "代理选择"
    type: select
    proxies:
      - DIRECT
      - GE

proxies:
  - name: GE
    server: 5.175.205.190
    port: 27774 
    type: vless
    udp: false
    uuid: 653137c6-474e-4a3d-9a20-5a5afb3d4a4f
    tls: false
    network: tcp

rules:
  # 1. 强行把所有 UDP 流量抓进拦截组，直接本地 REJECT（绝不放过，也不会触发死循环）
  # - NETWORK,udp,UDP-Blocker
  - IP-CIDR,162.62.97.37/32,DIRECT
  - NETWORK,udp,REJECT-DROP

  # 2. 其他正常的 TCP 流量走你的直连或代理选择
  - MATCH, DIRECT
